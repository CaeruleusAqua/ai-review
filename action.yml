name: 'XAI Review'
author: 'Nikita Filonov'
branding:
  icon: 'eye'
  color: 'purple'
description: '🚀 AI-powered code review tool'

inputs:
  review-command:
    default: 'run'
    required: false
    description: 'Which review mode to run (run, run-inline, run-summary, run-context)'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install XAI Review
      run: | 
        pip uninstall -y xai-review
        pip install --no-cache-dir --force-reinstall --no-deps git+https://github.com/CaeruleusAqua/ai-review.git@gitea_fix2
      shell: bash

    - name: Debug inline comments impl
      run: |
        python - <<'PY'
        from ai_review.services.vcs.gitea.client import GiteaVCSClient
        import inspect
        print("get_inline_comments:\n", inspect.getsource(GiteaVCSClient.get_inline_comments))
        PY
      shell: bash

    - name: Run AI Review
      run: |
        ai-review show-config
        ai-review ${{ inputs.review-command }}
      shell: bash
